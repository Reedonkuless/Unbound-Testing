name: Install CP33 package

on:
  push:
    branches: [main]
    paths:
      - '.cp33_upload/package.zip'
      - '.github/workflows/cp33-unpack.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository with CP33 package
        shell: bash
        run: |
          set -euo pipefail
          cp .cp33_upload/package.zip /tmp/cp33-package.zip
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          unzip -q /tmp/cp33-package.zip -d .
          rm -f .github/workflows/cp33-unpack.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Deploy Unbound Save Studio v0.5.0 CP33"
          git push origin HEAD:main
